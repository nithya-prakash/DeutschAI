name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check .
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Builds both images on every push to main (a real regression check — a
  # broken Dockerfile now fails CI) but never pushes them anywhere. No
  # registry, no secrets, no cloud account, no cost — deploying to a real
  # target is a separate decision, made explicitly, not a side effect of
  # this job existing. This is a deliberate stopping point, not an
  # oversight: nobody has yet chosen a hosting target for this project.
  # See docs/FEATURES.md for the future-work list.
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t deutschai-backend:ci ./apps/backend
      - name: Build frontend image
        run: docker build -t deutschai-frontend:ci ./apps/frontend
      - name: No deployment target configured
        run: |
          echo "Images build cleanly. No deployment target is configured yet —"
          echo "see docs/FEATURES.md for the future-work list."
